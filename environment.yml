name: metapli
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9.18
  - pytorch=1.13.1
  - pytorch-cuda=11.7
  - numpy=1.26.4
  - pandas=2.2.1
  - scipy=1.12.0
  - rdkit=2023.09.5
  - prolif=2.0.3
  - python-lmdb=1.4.1
  - pyyaml=6.0.1
  - pip
  - pip:
      - --find-links=https://data.dgl.ai/wheels/cu117/repo.html
      - dgl==1.0.0+cu117
      - dgllife==0.3.2
      - torch-scatter==2.1.2
      - torch-sparse==0.6.18
      - pytest==8.0.2
