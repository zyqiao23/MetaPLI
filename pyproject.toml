[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metapli"
version = "0.1.0"
description = "MPNN and ANP for protein–ligand activity prediction"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
  "torch==1.13.1",
  "dgl==1.0.0",
  "dgllife==0.3.2",
  "torch-scatter==2.1.2",
  "torch-sparse==0.6.18",
  "numpy==1.26.4",
  "pandas==2.2.1",
  "scipy==1.12.0",
  "lmdb==1.4.1",
  "PyYAML==6.0.1",
]

[project.scripts]
metapli-prepare-data = "metapli.prepare_data:main"
metapli-build-graphs = "metapli.graph_builder:main"
metapli-build-similarity = "metapli.similarity_builder:main"
metapli-train = "metapli.train:main"
metapli-predict = "metapli.predict:main"
metapli-evaluate = "metapli.evaluate:main"

[project.optional-dependencies]
structure = ["rdkit==2023.9.5", "prolif==2.0.3"]
test = ["pytest==8.0.2"]

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
